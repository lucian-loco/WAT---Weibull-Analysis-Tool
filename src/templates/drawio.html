<html>
<title>Draw.io Editor</title>
<head>
  <style type="text/css">
    iframe {
      border:0;
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:0;
      width:100%;
      height:100%
    }
  </style>

  <script type="text/javascript">
    var editor = 'https://embed.diagrams.net/?embed=1&ui=atlas&spin=1&proto=json&saveAndExit=0&noSaveBtn=1&noExitBtn=1&libraries=1&configure=1';

    function edit(document_data)
    {
      var iframe = document.createElement('iframe');
      iframe.setAttribute('frameborder', '0');

      var close = function()
      {
        window.removeEventListener('message', receive);
        document.body.removeChild(iframe);
      };

      var receive = function(evt)
      {
        if (evt.data.length > 0)
        {
          var msg = JSON.parse(evt.data);

          if (msg.event == 'init')
          {
            iframe.contentWindow.postMessage(JSON.stringify({action: 'load',
              autosave: 0, xml: document_data}), '*');
            iframe.contentWindow.postMessage(JSON.stringify({action: 'status',
              modified: true}), '*');
          }
          else if (msg.event == 'configure')
          {
            iframe.contentWindow.postMessage(JSON.stringify({action: 'configure',
              config: {
                "thumbWidth": 64,
                "thumbHeight": 64,
                "sidebarWidth": 160,
                "override": true,
                "defaultLibraries": "general;flowchart;basic;arrows2",
                "expandLibraries": false,
                "defaultCustomLibraries": [
{% for lib_url in drawio_libs %}"U{{lib_url}}"{% if not loop.last %},{% endif %}
{% endfor %}],
               }
              }), '*');
          }
        }
      };

      window.addEventListener('message', receive);
      iframe.setAttribute('src', editor);
      document.body.appendChild(iframe);
    };

    function htmlDecode(input) {
      var doc = new DOMParser().parseFromString(input, "text/html");
      return doc.documentElement.textContent;
    };

    function load()
    {
      var data = htmlDecode(`{{document_data}}`);
      edit(data);
    };
  </script>
</head>

<body onload="load();">
Starting Draw.IO...
</body>
</html>
