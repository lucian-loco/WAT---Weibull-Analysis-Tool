<html>
<title>Draw.io Embedded</title>
<head>
	<style type="text/css">
		iframe {
			border:0;
			position:fixed;
			top:0;
			left:0;
			right:0;
			bottom:0;
			width:100%;
			height:100%
		}
	</style>

	<script type="text/javascript">
		var editor = 'https://embed.diagrams.net/?embed=1&ui=atlas&spin=1&proto=json&saveAndExit=0&noSaveBtn=1&noExitBtn=1';

		function edit(document_data)
		{
			var iframe = document.createElement('iframe');
			iframe.setAttribute('frameborder', '0');

			var close = function()
			{
				window.removeEventListener('message', receive);
				document.body.removeChild(iframe);
			};

			var receive = function(evt)
			{
				if (evt.data.length > 0)
				{
					var msg = JSON.parse(evt.data);

					if (msg.event == 'init')
					{
						iframe.contentWindow.postMessage(JSON.stringify({action: 'load',
							autosave: 1, xml: document_data}), '*');
						iframe.contentWindow.postMessage(JSON.stringify({action: 'status',
							modified: true}), '*');
					}
				}
			};

			window.addEventListener('message', receive);
			iframe.setAttribute('src', editor);
			document.body.appendChild(iframe);
		};

		function htmlDecode(input) {
			var doc = new DOMParser().parseFromString(input, "text/html");
			return doc.documentElement.textContent;
		};

		function load()
		{
			var raw_document2 = `<mxfile host="Electron" modified="2024-06-20T06:21:05.405Z" agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/24.2.5 Chrome/120.0.6099.109 Electron/28.1.0 Safari/537.36" etag="fM6xn7cHloPpOsP0QE1b" version="24.2.5" type="device">
  <diagram name="Page-1" id="XKkBVcsClaVHinfvVAaB">
    <mxGraphModel dx="447" dy="702" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="800" pageHeight="600" background="none" math="0" shadow="0">
      <root>
        <mxCell id="0" />
        <mxCell id="1" parent="0" />
        <mxCell id="QWeSVEOsqKhbFG" value="CFV-864-AGADE" style="fillColor=#fff2cc;strokeColor=none;" parent="1" vertex="1">
          <mxGeometry x="10" y="200" width="200" height="20" as="geometry" />
        </mxCell>
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
			var data = htmlDecode(`{{document_data}}`);
			edit(data);
		};
	</script>
</head>

<body onload="load();">
Starting Draw.IO...
</body>
</html>
